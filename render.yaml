services:
  - type: web
    name: pg-labs-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_DB_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://pglabs.agency,https://www.pglabs.agency,http://localhost:3000
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: true
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false
